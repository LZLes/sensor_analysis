# Render Blueprint — see https://render.com/docs/blueprint-spec
# Deploys the FastAPI backend + a managed Postgres in one place, per the
# hosting decision in the migration plan (Vercel handles the frontend
# separately — see frontend/vercel.json).
databases:
  - name: sensor-analysis-db
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: web
    name: sensor-analysis-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sensor-analysis-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false   # set manually in the Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false   # set manually in the Render dashboard
      - key: FRONTEND_ORIGIN
        value: https://your-app.vercel.app   # update after the Vercel deploy exists
