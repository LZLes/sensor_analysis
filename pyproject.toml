# Tool configuration only — the app isn't packaged as a Python distribution.

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv*", "packaging/build"]

[tool.ruff.lint]
# Pyflakes (undefined names, unused imports/variables) plus a few cheap
# correctness checks. Style is left to the surrounding code.
select = ["F", "E9", "B006", "B008", "B015", "PLE"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/File() in argument defaults is the framework's idiom.
"web_app/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["core", "modes", "web_app"]
